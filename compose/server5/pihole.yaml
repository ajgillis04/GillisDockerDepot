# Pi-hole - network-wide ad blocker for the cottage (server5).
#
# DNS only, no DHCP: the Bell Giga Hub keeps handing out addresses.
# The hub's Advanced tools > DNS is set manually to this PC (192.168.3.10), so every
# device asks the hub and the hub forwards to Pi-hole. Pi-hole therefore sees most
# queries as coming from 192.168.3.1; that's a Giga Hub limit (its DHCP can't hand out
# a different DNS server).
#
# The PC has a reserved address on the hub (192.168.3.10), set as PIHOLE_IP in .env.
# Ports are bound to that address only, so they don't clash with systemd-resolved's
# stub on 127.0.0.53.
#
# .env: PIHOLE_IP, PIHOLE_WEB_PORT, PIHOLE_WEBPASSWORD, PIHOLE_TOKEN (homepage widget)

services:
  pihole:
    container_name: pihole.${HOST_NAME}
    hostname: pihole.${HOST_NAME}.lan
    image: pihole/pihole:latest
    cap_add:
      - SYS_TIME
      - SYS_NICE
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_revServers: true,192.168.3.0/24,192.168.3.1#53,lan
      FTLCONF_dns_domain: lan
      FTLCONF_dhcp_active: false
      FTLCONF_debug_api: false
      TEMPERATUREUNIT: c
    networks:
      - mediaserver
    ports:
      - "${PIHOLE_IP}:53:53/tcp"
      - "${PIHOLE_IP}:53:53/udp"
      - "${PIHOLE_WEB_PORT}:80"
    volumes:
      - ${DOCKERDIR}/pihole/etc:/etc/pihole
      - ${DOCKERDIR}/logs/pihole:/var/log/pihole
    restart: always
    labels:
      ## Watchtower Enable
      - "com.centurylinklabs.watchtower.enable=true"
      ## Homepage Labels
      - "homepage.group=Network"
      - "homepage.name=Pi-hole"
      - "homepage.icon=pi-hole.png"
      - "homepage.href=http://${PIHOLE_IP}:${PIHOLE_WEB_PORT}/admin"
      - "homepage.description=Network-wide ad blocker"
      ## Homepage Widget
      - "homepage.widget.type=pihole"
      - "homepage.widget.url=http://pihole.${HOST_NAME}"
      - "homepage.widget.version=6"
      - "homepage.widget.key=${PIHOLE_WEBPASSWORD}"

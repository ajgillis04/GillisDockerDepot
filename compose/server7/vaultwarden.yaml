# Vaultwarden - A Bitwarden-compatible server.
# Before the first "up", generate an admin token (argon2 hash of the admin password):
#   echo -n "Your Personal Password" | argon2 "$(openssl rand -base64 32)" -e -id -k 65540 -t 3 -p 4 > secrets/vaultwarden_admin_token
# .env needs VAULTWARDEN_PORT and VAULTWARDEN_SMTP_FROM (the Gmail account that owns
# secrets/nas_gmail_app_pass). Settings saved on the /admin page go to data/config.json
# and override everything below, so prefer changing them here.
# Accounts come by invitation only (signups off): invite from /admin or the organization.

services:
  vaultwarden:
    container_name: vaultwarden.${HOST_NAME}
    hostname: vaultwarden.${HOST_NAME}.lan
    image: vaultwarden/server:latest
    environment:
      TZ: ${TZ}
      PGID: ${PGID}
      PUID: ${PUID}
      #DOMAIN: ${DOMAINNAME}
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      DATABASE_URL: sqlite:///data/db.sqlite3   # 1.37+ needs the scheme to create a new database
      #DATABASE_URL_FILE: /run/secrets/vaultwarden_db_password # for use in an external database
      DOMAIN: "https://vault.${DOMAINNAME}"
      ORG_ADMIN_RECOVERY_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      INVITATION_ORG_NAME: "Kennedy Vault"
      IP_HEADER: CF-Connecting-IP   # real client IP behind the Cloudflare tunnel
      SMTP_HOST: ${SMTPHOST}
      SMTP_PORT: ${SMTPPORT}
      SMTP_SECURITY: starttls
      SMTP_FROM: ${VAULTWARDEN_SMTP_FROM}
      SMTP_FROM_NAME: "Kennedy Vault"
      SMTP_USERNAME: ${VAULTWARDEN_SMTP_FROM}
      SMTP_PASSWORD_FILE: /run/secrets/nas_gmail_app_pass
    networks:
      - mediaserver
    ports:
      - "${VAULTWARDEN_PORT}:80"
    volumes:
      - ${DOCKERDIR}/vaultwarden/config:/config      
      - ${DOCKERDIR}/vaultwarden/data:/data
      - ${DOCKERDIR}/logs/vaultwarden:/var/log
    restart: always
    secrets:      
      - vaultwarden_admin_token
      - nas_gmail_app_pass
#      - vaultwarden_db_password
    security_opt:
      - no-new-privileges:true
    labels:
      ## Watchtower Enable
      - "com.centurylinklabs.watchtower.enable=true"
      ## Homepage Labels
      - "homepage.group=Infrastructure"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://vault.${DOMAINNAME}/"
      - "homepage.description=Self-hosted password management"

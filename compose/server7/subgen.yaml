# SubGen - Whisper-based speech-to-text subtitle generator for Bazarr.

services:
  subgen:
    container_name: subgen.${HOST_NAME}
    hostname: subgen.${HOST_NAME}.lan
    image: mccloud/subgen:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DOMAINNAME: ${DOMAINNAME}
      HOST_NAME: ${HOST_NAME}
      WHISPER_MODEL: small.en
      WHISPER_THREADS: 4
      TRANSCRIBE_DEVICE: cpu
      CONCURRENT_TRANSCRIPTIONS: 1
      WEBHOOKPORT: 9000
      PROCADDEDMEDIA: "True"
      PROCMEDIAONPLAY: "True"
      #TRANSCRIBE_FOLDERS: "/tv|/movies" # Batch Proceesing for backlog old shows tunrn off after its done
      ONLY_SKIP_IF_SUBGEN_SUBTITLE: "True"
      SKIP_IF_TO_TRANSCRIBE_SUB_ALREADY_EXIST: "False"
      MONITOR: "True"
      DEBUG: "False"
      MODEL_PATH: /subgen/models
    networks:
      - mediaserver
    ports:
      - "${SUBGEN_PORT}:9000"
    volumes:
      - ${DOCKERDIR}/subgen/models:/subgen/models
      - ${MEDIASHARE}/Videos/TV:/tv
      - ${MEDIASHARE}/Videos/Movies:/movies
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      ## Watchtower Enable
      - "com.centurylinklabs.watchtower.enable=true"
      ## Homepage Labels (no widget)
      - "homepage.group=Media"
      - "homepage.name=SubGen"
      - "homepage.icon=subtitles"
      - "homepage.href=http://subgen.${DOMAINNAME}:9000"
      - "homepage.description=Whisper STT backend for Bazarr"
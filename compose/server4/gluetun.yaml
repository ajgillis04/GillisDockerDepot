# ------------------------------------------------------------------------------
# Gluetun - VPN container for Transmission
# ------------------------------------------------------------------------------
# Holds the PIA VPN connection. Transmission runs inside its network
# (network_mode: service:gluetun), so all its traffic goes through the VPN, and
# if the VPN drops, Gluetun's firewall blocks it instead of leaking your home IP.
#
# Why it replaces transmission-openvpn (prepared 2026-11-08, live on server1 the
# same day): transmission-openvpn exits whenever OpenVPN loses contact, so Docker
# keeps restarting it. Gluetun reconnects inside the container without exiting,
# so Transmission keeps running.
#
# Transmission's port is published here, not on Transmission. The network aliases
# keep the old name working, so Sonarr, Radarr, Homepage and the Cloudflare tunnel
# need no changes.
#
# Secrets (one line each, in ${SECRETSDIR}): pia_username, pia_password
#
# Switching over from transmission-openvpn (do once, on this server):
#   1. Stop the old container:
#        docker stop transmission-openvpn.${HOST_NAME}
#   2. Copy its settings and torrent list (the old folder stays, for rollback):
#        mkdir -p ${DOCKERDIR}/transmission
#        cp -a ${DOCKERDIR}/transmission-openvpn/config/transmission-home ${DOCKERDIR}/transmission/config
#        rm -f ${DOCKERDIR}/transmission/config/stats.json.tmp.*
#      Then in ${DOCKERDIR}/transmission/config/settings.json set
#        "bind-address-ipv4": "0.0.0.0"   (the old image wrote its VPN address there)
#   3. Download PIA's current server list (the built-in one can be stale):
#        mkdir -p ${DOCKERDIR}/gluetun
#        docker run --rm -v ${DOCKERDIR}/gluetun:/gluetun qmcgaw/gluetun:v3 update -enduser -providers "private internet access"
#   4. Pull this repo, then start the new pair:
#        docker compose -p mediaserver -f docker-compose-server4.yaml up -d gluetun transmission
#   5. Check: docker logs gluetun.${HOST_NAME} shows "Public IP address is" (not
#      your home IP), the Transmission web UI lists your torrents, and Sonarr/Radarr's
#      download client test passes.
#   Rollback: docker compose ... stop gluetun transmission, put the
#   transmission-openvpn.yaml include back in docker-compose-server4.yaml, and
#   docker compose ... up -d transmission-openvpn.
#
# Notes:
#   - Watchtower is OFF for this container on purpose. Recreating Gluetun leaves
#     Transmission attached to a network that no longer exists. Update both
#     together by hand:
#       docker compose -p mediaserver -f docker-compose-server4.yaml pull gluetun
#       docker compose -p mediaserver -f docker-compose-server4.yaml up -d gluetun transmission
#   - If Gluetun itself ever restarts, recreate Transmission:
#       docker compose -p mediaserver -f docker-compose-server4.yaml up -d --force-recreate --no-deps transmission
#   - Check the VPN: docker logs gluetun.${HOST_NAME}   (look for "Public IP address is")
#   - If no server in the region answers ("TLS key negotiation failed"), refresh the
#     server list (step 3 above) or pick another region.
#   - Don't run a test VPN container in the same PIA region at the same time;
#     on 2026-11-03 that knocked the live connection off.
#   - Port forwarding is off. PIA can forward a port, but Transmission would need
#     to be told the new port on every reconnect.
# ------------------------------------------------------------------------------
services:
  gluetun:
    container_name: gluetun.${HOST_NAME}
    hostname: gluetun.${HOST_NAME}.lan
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER_SECRETFILE: /run/secrets/pia_username
      OPENVPN_PASSWORD_SECRETFILE: /run/secrets/pia_password
      # US Washington DC: second fastest in tests from server1 on 2026-11-08
      # (62/62/65 MB/s; Maine 64/69/63, New York 50/58/59, Montreal 13). Each server
      # gets its own region (server1 Maine, server4 DC, server7 New York) because
      # several connections on one PIA login in the same region may knock each
      # other off. Not yet tested from this server; any PIA region works here.
      SERVER_REGIONS: US Washington DC
      VPN_PORT_FORWARDING: "off"
      # Refresh the VPN server list daily; the list is kept in ${DOCKERDIR}/gluetun.
      UPDATER_PERIOD: 24h
    networks:
      mediaserver:
        aliases:
          - transmission.${HOST_NAME}
          - transmission-openvpn.${HOST_NAME}   # old name, still used by the tunnel and the -arr apps
    ports:
      - "${TRANSMISSION_PORT}:9091"   # Transmission web UI and RPC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERDIR}/gluetun:/gluetun   # server list (servers.json), kept across recreates
    secrets:
      - pia_username
      - pia_password
    restart: always
    labels:
      ## Watchtower Enable
      - "com.centurylinklabs.watchtower.enable=false" # update by hand, see Notes above
      ## Homepage Labels
      - "homepage.group=Network"
      - "homepage.name=Gluetun"
      - "homepage.icon=gluetun.png"
      - "homepage.description=VPN for Transmission"
    logging:
      driver: json-file
      options:
        max-size: 10m

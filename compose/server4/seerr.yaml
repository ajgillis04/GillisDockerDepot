# Seerr - Successor to Overseerr. Drop-in replacement with automatic migration.
# Uses the SAME config folder as Overseerr for seamless migration.

# =============================================================================
#  Overseerr → Seerr Migration Procedure (Correct Order)
#
#  IMPORTANT: Seerr MUST migrate the Overseerr config BEFORE deleting Overseerr.
#
#  1. Stop Overseerr:
#       docker stop overseerr.${HOST_NAME}
#
#  2. Start Seerr using the SAME Overseerr config folder:
#       volumes:
#         - ${DOCKERDIR}/appdata/overseerr/config:/app/config
#
#     Then run:
#       docker compose up -d seerr
#
#     Seerr will detect the Overseerr database and automatically migrate:
#       - users
#       - requests
#       - settings
#       - history
#
#  3. Verify migration in Seerr:
#       Settings → About → Confirm no migration warnings
#       Check requests, users, and settings
#
#  4. Once migration is confirmed, shut down Overseerr permanently:
#       docker stop overseerr.${HOST_NAME}
#       docker rm overseerr.${HOST_NAME}
#
#  5. Rename the Overseerr folder to Seerr:
#       mv ${DOCKERDIR}/appdata/overseerr \
#          ${DOCKERDIR}/appdata/seerr
#
#  6. Update Seerr docker-compose to point to the new folder:
#       volumes:
#         - ${DOCKERDIR}/appdata/seerr/config:/app/config
#
#     Then restart Seerr:
#       docker compose up -d seerr
#
#  7. (Optional) Update Cloudflared tunnel:
#       - hostname: overseerr.${DOMAINNAME}
#         service: http://seerr.${HOST_NAME}:5055
#
#  8. (Optional) Remove old Overseerr logs:
#       rm -rf ${DOCKERDIR}/logs/overseer
# =============================================================================


services:
  seerr:
    container_name: seerr.${HOST_NAME}
    hostname: seerr.${HOST_NAME}.lan
    image: ghcr.io/seerr-team/seerr:latest
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      DOMAINNAME: ${DOMAINNAME}
    networks:
      - mediaserver
    ports:
      - "${SEERR_PORT}:5055"      
    volumes:
      #- ${DOCKERDIR}/overseerr/config:/app/config # Use this for Migration Step 1
      - ${DOCKERDIR}/seerr/config:/app/config # Use this for after Migration Step 5
      - ${DOCKERDIR}/logs/seerr:/var/log 
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      ## Watchtower enabled?
      - "com.centurylinklabs.watchtower.enable=true"
      ## Homepage Labels
      - "homepage.group=Media"
      - "homepage.name=Seerr"
      - "homepage.icon=seerr.png"
      - "homepage.href=https://seerr.${DOMAINNAME}/"
      - "homepage.description=Request and manage your media"
      ## Homepage Widget
      - "homepage.widget.type=overseerr"
      - "homepage.widget.url=http://seerr.${HOST_NAME}:5055"
      - "homepage.widget.key=${SEERR_API_KEY}"

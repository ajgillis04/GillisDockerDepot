# ------------------------------------------------------------------------------
# Kometa - Plex collections (and later rating badges on posters)
# ------------------------------------------------------------------------------
# Runs here, not on the NAS: it talks to Plex over the network, and building
# overlay posters uses this machine's CPU instead of the NAS's.
# Config (with the Plex token and TMDb key) is in ${DOCKERDIR}/kometa/config/config.yml,
# git-ignored. Started small on purpose: Movies collections only, no overlays.
# A heavy Kometa run once corrupted the Plex database beyond repair, so:
#   - it runs at 00:30, before Plex's own maintenance window (02:00 onwards);
#   - back up the Plex database before widening what it does;
#   - add libraries and overlays one step at a time.
# Run now:  docker compose -p mediaserver -f docker-compose-server2.yaml run --rm kometa --run
# ------------------------------------------------------------------------------
services:
  kometa:
    container_name: kometa.${HOST_NAME}
    hostname: kometa.${HOST_NAME}.lan
    image: kometateam/kometa:latest
    environment:
      TZ: ${TZ}
      KOMETA_TIMES: "00:30"
      KOMETA_CONFIG: /config/config.yml
    networks:
      - mediaserver
    volumes:
      - ${DOCKERDIR}/kometa/config:/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

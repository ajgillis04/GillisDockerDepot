# ***********************************************************************************
# Service: ComfyUI
# Purpose: Local image generation using Stable Diffusion (GPU accelerated).
# Notes:
#   - Uses your GPU via NVIDIA Docker runtime.
#   - Models are stored in the comfyui_models Docker volume, on the NVMe.
#   - gillis_vram_swap.py hands the GPU between Ollama and ComfyUI for each image.
#   - Replaces the ai-dock image, which opened public Cloudflare tunnels by default.
# ***********************************************************************************

services:
  comfyui:
    container_name: comfyui.${HOST_NAME}
    hostname: comfyui.${HOST_NAME}.lan
    image: yanwk/comfyui-boot:cu130-slim-v2
    gpus: all
    environment:
      TZ: ${TZ}
      CLI_ARGS: "--preview-method none"
      OLLAMA_URL: http://ollama.${HOST_NAME}:11434
    networks:
      - mediaserver
    ports:
      # ComfyUI has no login, so it's published on this machine only.
      - "127.0.0.1:${COMFYUI_PORT}:8188"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Docker volume on the NVMe. Loading from D: over 9p takes minutes.
      - comfyui_models:/root/ComfyUI/models
      - ${DOCKERDIR}/comfyui/output:/root/ComfyUI/output
      - ${DOCKERDIR}/comfyui/input:/root/ComfyUI/input
      - ${DOCKERDIR}/comfyui/user:/root/ComfyUI/user
      - ${COMPOSE_DIR}/comfyui/gillis_vram_swap.py:/root/ComfyUI/custom_nodes/gillis_vram_swap.py:ro
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Infrastructure"
      - "homepage.name=ComfyUI"
      - "homepage.icon=comfyui.png"
      - "homepage.href=https://comfyui.${DOMAINNAME}/"
      - "homepage.description=Local image generation"

volumes:
  comfyui_models:
    name: comfyui_models

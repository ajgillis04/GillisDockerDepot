# SearXNG settings for the local LLM. Anything not listed uses the upstream defaults.
# secret_key comes from the SEARXNG_SECRET environment variable.
use_default_settings: true

general:
  instance_name: "Local search"

server:
  limiter: false      # Only OpenWebUI calls this, so bot detection would just block it.
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json            # OpenWebUI needs this. Without it every query returns 403.

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0

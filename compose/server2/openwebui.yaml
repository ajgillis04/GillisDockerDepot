# ***********************************************************************************
# Service: OpenWebUI
# Purpose: Unified AI interface for LLM chat, web search, image generation and code.
# Notes:
#   - Connects to Ollama for LLMs, SearXNG for search, ComfyUI for images and the
#     Jupyter sandbox for running code.
#   - Data is in the openwebui_data Docker volume on the NVMe. SQLite and the vector
#     store are too slow and too fragile on D: over 9p.
#   - Most settings live in its database, not here. openwebui/apply-settings.py sets them.
#   - WEBUI_SECRET_KEY is set in .env. Without it, every recreate logs everyone out.
# ***********************************************************************************

services:
  openwebui:
    container_name: openwebui.${HOST_NAME}
    hostname: openwebui.${HOST_NAME}.lan
    image: ghcr.io/open-webui/open-webui:v0.12.5
    environment:
      TZ: ${TZ}
      ENV: prod
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: http://ollama.${HOST_NAME}:11434
    networks:
      - mediaserver
      - llm_sandbox
    ports:
      - "${OPENWEBUI_PORT}:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - openwebui_data:/app/backend/data
      - ${DOCKER_NAS}:/app/backend/data/knowledge/gillis_docker_depot:ro
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Infrastructure"
      - "homepage.name=OpenWebUI"
      - "homepage.icon=openwebui.png"
      - "homepage.href=https://openwebui.${DOMAINNAME}/"
      - "homepage.description=Unified AI interface"

volumes:
  openwebui_data:
    name: openwebui_data

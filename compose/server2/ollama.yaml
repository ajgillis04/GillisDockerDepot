# ***********************************************************************************
# Service: Ollama
# Purpose: Local LLM engine Hosts models such as Llama3, Mistral, Phi‑3.
# Notes: 
#   - Runs on the GPU (RTX 3060 12GB), shared with ComfyUI and the Tdarr node.
#   - Models are stored in the ollama_models Docker volume, on the NVMe.
#   - OpenWebUI connects to this service via API.
# ***********************************************************************************

services:
  ollama:
    container_name: ollama.${HOST_NAME}
    hostname: ollama.${HOST_NAME}.lan
    image: ollama/ollama:0.40.14
    gpus: all
    environment:
      TZ: ${TZ}
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # OLLAMA_CONTEXT_LENGTH is the real setting. OLLAMA_NUM_CTX is ignored and leaves the 4096 default.
      OLLAMA_CONTEXT_LENGTH: "16384"
      # Kept short because the Tdarr node needs VRAM too. A reload from the NVMe takes 7 to 15 seconds.
      OLLAMA_KEEP_ALIVE: "10m"
    networks:
      - mediaserver
    ports:
      - "${OLLAMA_PORT}:11434"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Docker volume on the NVMe. D: is a hard drive reached over 9p at about 30 MB/s, too slow to load models.
      - ollama_models:/root/.ollama
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Infrastructure"
      - "homepage.name=Ollama"
      - "homepage.icon=ollama.png"
      - "homepage.href=https://ollama.${DOMAINNAME}/"
      - "homepage.description=Local LLM engine"

volumes:
  ollama_models:
    name: ollama_models

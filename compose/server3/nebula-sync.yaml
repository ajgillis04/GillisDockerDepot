# nebula-sync - Copies Pi-hole settings from the primary Pi-hole to this one.
#
# Primary = the Pi-hole that runs DHCP, where blocklists, allow/block lists, local DNS
# and DHCP reservations are edited. Replica = the Pi-hole on this server (DNS only).
# Anything changed only on the replica is overwritten at the next sync.
#
# Not a full sync on purpose: a full sync would copy "DHCP on" to the replica and
# the network would have two DHCP servers. Only these are copied:
#   - blocklists, allow/block lists, groups and clients (then gravity is rebuilt)
#   - DNS settings such as local DNS records and CNAMEs, except the three that
#     pihole.yaml sets through FTLCONF_ variables (those are read-only in the replica)
#   - DHCP reservations only (dhcp.hosts), never DHCP on/off or the address range
#
# Secrets (one line each, in ${SECRETSDIR}, readable by uid 1000):
#   nebula_sync_primary:  http://<primary-ip>|<password or app password>
#   nebula_sync_replicas: http://<replica-ip>|<password or app password>
# With app passwords, set webserver.api.app_sudo = true on the replica.
#
# Check it: docker logs nebula-sync.${HOST_NAME}

services:
  nebula-sync:
    container_name: nebula-sync.${HOST_NAME}
    hostname: nebula-sync.${HOST_NAME}.lan
    image: ghcr.io/lovelaze/nebula-sync:v0.11.3
    user: "1000:1000"
    environment:
      TZ: ${TZ}
      PRIMARY_FILE: /run/secrets/nebula_sync_primary
      REPLICAS_FILE: /run/secrets/nebula_sync_replicas
      FULL_SYNC: "false"
      RUN_GRAVITY: "true"
      # Daily: each run also rebuilds gravity, which downloads every blocklist again.
      CRON: "15 4 * * *"
      SYNC_GRAVITY_GROUP: "true"
      SYNC_GRAVITY_AD_LIST: "true"
      SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_DOMAIN_LIST: "true"
      SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_CLIENT: "true"
      SYNC_GRAVITY_CLIENT_BY_GROUP: "true"
      SYNC_CONFIG_DNS: "true"
      SYNC_CONFIG_DNS_EXCLUDE: "upstreams,dnssec,revServers"
      SYNC_CONFIG_DHCP: "true"
      SYNC_CONFIG_DHCP_INCLUDE: "hosts"
    restart: unless-stopped
    secrets:
      - nebula_sync_primary
      - nebula_sync_replicas
    labels:
      # Pinned version; update by hand after reading the release notes.
      - "com.centurylinklabs.watchtower.enable=false"

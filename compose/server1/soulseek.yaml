# ------------------------------------------------------------------------------
# slskd - Soulseek daemon with web GUI
# ------------------------------------------------------------------------------
# Provides a headless Soulseek client with API and web interface.
# Can integrate with Spotify-to-Plex for missing track acquisition.
#
# Runs inside the Gluetun VPN's network (see gluetun.yaml), so its traffic only
# leaves through the VPN. Its web UI ports are published by Gluetun, and
# soulseek.${HOST_NAME} is a Gluetun alias (the Cloudflare tunnel uses it).
# Until 2026-11-08 it shared transmission-openvpn's network instead, and lost its
# network every time that container restarted.
#
# Notes:
#   - If Gluetun restarts, recreate this container (see gluetun.yaml).
#   - The P2P listen port (50300) isn't reachable from outside through the VPN,
#     so other users can't connect in. Searching and downloading still work.
# ------------------------------------------------------------------------------
services:
  soulseek:
    container_name: soulseek.${HOST_NAME}
 #   hostname: soulseek.${HOST_NAME}.lan
    image: slskd/slskd:latest
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}

      # --- Soulseek credentials ---
      SLSKD_USERNAME: ${SLSKD_USERNAME}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD}

      # --- Optional integration key for Spotify-to-Plex ---
      SLSKD_API_KEY: ${LIDARR_API_KEY} # Reusing LIDARR_API_KEY for convenience
      SLSKD_REMOTE_CONFIGURATION: true

      UMASK: "002"

    # Use the Gluetun VPN network for privacy; ports are published by Gluetun
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

    volumes:
      - ${DOCKERDIR}/soulseek/app:/app      
      - ${DOCKERDIR}/logs/soulseek:/app/logs
      - ${USERDOWNLOAD}/Torrents:/downloads

    restart: always
    security_opt:
      - no-new-privileges:true

    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Soulseek"
      - "homepage.icon=slskd.png"
      - "homepage.href=http://soulseek.${HOST_NAME}:${SLSKD_HTTP_PORT}"
      - "homepage.description=Soulseek daemon with web GUI"
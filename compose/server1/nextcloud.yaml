# Nextcloud - A private cloud storage solution

# Permissions if you mount the host's home directories into Nextcloud. Note: this removes the admin's right to read user files.
# mkdir -p /share/nextcloud/<username>
# sudo chown -R <userid>:33 /share/nextcloud/<username>
# sudo chmod -R 770 /share/nextcloud/<username>
# sudo chmod -R g+s /share/nextcloud/<username>
# sudo ln -s /share/nextcloud/<username> /share/homes/<username>/Documents
# 

services:
  nextcloud:
    container_name: nextcloud.${HOST_NAME}
    hostname: nextcloud.${HOST_NAME}.lan
    image: nextcloud:34-apache # pinned: upgrade one major version at a time (31 -> 34 done 2026-11-14); nextcloud-cron below uses the same tag
    user: "0:0"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: 007
      DOMAINNAME: ${DOMAINNAME}
      MYSQL_HOST: mariadb.${HOST_NAME}
      MYSQL_DATABASE: nextcloud      
      MYSQL_USER_FILE: /run/secrets/nextcloud_mysql_user
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mysql_password
    networks:
      - mediaserver
    ports:
      - "${NEXTCLOUD_PORT}:80"
    volumes:
      - ${DOCKERDIR}/nextcloud/var/www/html:/var/www/html      
      - ${DOCKERDIR}/logs/nextcloud:/var/log
      - ${NEXTCLOUD_EXSTORAGE}:/nasshares
      - ${NEXTCLOUD_HOMES}:/homes
      - ${BASE_DIR}/compose/php/security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro # PHP security overrides
      - ${BASE_DIR}/compose/nextcloud/hsts.conf:/etc/apache2/conf-enabled/zz-hsts.conf:ro

    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      ## Watchtower Enable
      - "com.centurylinklabs.watchtower.enable=false" # Disable Watchtower for this container; upgrade it manually
      ## Homepage Labels
      - "homepage.group=Infrastructure"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.${DOMAINNAME}/"
      - "homepage.description=Your private cloud"

  # Runs Nextcloud's background jobs every 5 minutes (clean-up, expired file locks, previews, notifications).
  # Same image and volumes as nextcloud; keep the tag in step when upgrading.
  nextcloud-cron:
    container_name: nextcloud-cron.${HOST_NAME}
    hostname: nextcloud-cron.${HOST_NAME}.lan
    image: nextcloud:34-apache
    entrypoint: /cron.sh
    environment:
      TZ: ${TZ}
      PHP_MEMORY_LIMIT: 2G # photo metadata/preview jobs on large images need more than the default 512M
    depends_on:
      - nextcloud
    networks:
      - mediaserver
    volumes:
      - ${DOCKERDIR}/nextcloud/var/www/html:/var/www/html
      - ${NEXTCLOUD_EXSTORAGE}:/nasshares
      - ${NEXTCLOUD_HOMES}:/homes
      - ${BASE_DIR}/compose/php/security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # upgraded together with nextcloud

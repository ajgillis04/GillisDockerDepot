# Lineup - Weekly game organizer: rosters, rotations and balanced teams.
# Reached only through the Cloudflare tunnel, so it publishes no port. Its image is built locally.
services:
  lineup:
    container_name: lineup.${HOST_NAME}
    hostname: lineup.${HOST_NAME}.lan
    image: lineup:local
    environment:
      LINEUP_TIMEZONE: ${TZ}
      LINEUP_SECRET_KEY: ${LINEUP_SECRET_KEY}
      LINEUP_COOKIE_SECURE: "true"
      LINEUP_BEHIND_CLOUDFLARE: "true"
      # These stay false until real sending is approved. Changing them here is deliberate and visible.
      LINEUP_ALLOW_GROUP_SEND: "false"
      LINEUP_ALLOW_PERSON_SEND: "false"
      # WhatsApp bridge below. Group posts go to Andy until the WhatsApp page says otherwise.
      LINEUP_BRIDGE_URL: http://lineup-wa:3000
      LINEUP_BRIDGE_TOKEN: ${LINEUP_BRIDGE_TOKEN}
    networks:
      - mediaserver
      - lineup-wa
    volumes:
      - ${DOCKERDIR}/lineup:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      ## Watchtower enabled? The image is local, so there's nothing to pull.
      - "com.centurylinklabs.watchtower.enable=false"
      ## Homepage Labels
      - "homepage.group=Other"
      - "homepage.name=Lineup"
      - "homepage.icon=mdi-hockey-sticks"
      - "homepage.href=https://lineup.${DOMAINNAME}/"
      - "homepage.description=Weekly game organizer"

  # WhatsApp bridge - holds the bot's linked-device session and sends only what Lineup asks it to.
  # Its own network, shared only with Lineup; no published port. Linked by scanning a QR code on Lineup's WhatsApp page.
  # Unofficial WhatsApp client: the bot's number (not Andy's) is the one at risk of a ban.
  lineup-wa:
    container_name: lineup-wa.${HOST_NAME}
    hostname: lineup-wa
    image: lineup-bridge:local
    environment:
      BRIDGE_TOKEN: ${LINEUP_BRIDGE_TOKEN}
    networks:
      - lineup-wa
    volumes:
      - ${DOCKERDIR}/lineup-wa:/auth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  lineup-wa:
    name: lineup-wa

# ------------------------------------------------------------------------------
# repo-updater - monthly "updates ready" email, with a button to upgrade them
# ------------------------------------------------------------------------------
# Once a month (CHECK_AT) it pulls this repo (files only, nothing restarts) and works
# out which containers the new commits change. If any, it emails the list with a
# button. The page behind it (Cloudflare Access) shows the list and an "Upgrade"
# button, which recreates only those containers, then emails the result.
# Images are not its job; Watchtower handles those.
#
# Never upgraded from the button (REPO_UPDATE_SKIP): cloudflared, guacamole, guacd
# and repo-updater itself, because a bad change there can lock everyone out, and
# here also sbs-*, which have their own deploy steps.
#
# Scripts: scripts/repo-updater/ (mounted, so a pull updates them; no rebuild).
# Needs in .env: REPO_UPDATE_KEY (random), REPO_UPDATE_MAIL_TO, and the Gmail app
# password in ${SECRETSDIR}/nas_gmail_app_pass (see scripts/send_mail.sh).
# Tunnel: deploy.<domain> -> http://repo-updater.<host>:8080
#
# By hand:
#   docker exec repo-updater.${HOST_NAME} sh ${BASE_DIR}/scripts/repo-updater/check.sh            # check now
#   docker exec repo-updater.${HOST_NAME} sh ${BASE_DIR}/scripts/repo-updater/check.sh --resend   # email what is pending again
#   docker exec repo-updater.${HOST_NAME} sh ${BASE_DIR}/scripts/repo-updater/apply.sh
# Log: ${DOCKERDIR}/repo-updater/updater.log, last result in last-apply.txt
# ------------------------------------------------------------------------------
services:
  repo-updater:
    container_name: repo-updater.${HOST_NAME}
    hostname: repo-updater.${HOST_NAME}.lan
    build: ${BASE_DIR}/scripts/repo-updater
    image: repo-updater:local
    command: sh ${BASE_DIR}/scripts/repo-updater/run.sh
    user: "${PUID}:${PGID}"
    group_add:
      - "0" # the Docker socket is root:root 660 on QNAP
    environment:
      TZ: ${TZ}
      SERVER: server1
      HOST_NAME: ${HOST_NAME}
      BASE_DIR: ${BASE_DIR}
      CHECK_AT: "0109" # the 1st of the month, 09:00
      REPO_UPDATE_SKIP: cloudflared guacamole guacd repo-updater sbs-* # SBS has its own deploy steps (migrations)
      UPDATE_URL: https://deploy.${DOMAINNAME}/cgi-bin/update
      REPO_UPDATE_KEY: ${REPO_UPDATE_KEY}
      MAIL_TO: ${REPO_UPDATE_MAIL_TO}
      NAS_MAIL_PASS_FILE: ${SECRETSDIR}/nas_gmail_app_pass
    networks:
      - mediaserver
    volumes:
      - ${BASE_DIR}:${BASE_DIR} # same path as on the host, so compose resolves paths the same way
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${BASE_DIR}
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # local build
      - "homepage.group=Infrastructure"
      - "homepage.name=Repo updater"
      - "homepage.icon=git.png"
      - "homepage.href=https://deploy.${DOMAINNAME}/cgi-bin/update?key=${REPO_UPDATE_KEY}" # key comes from .env, not the repo
      - "homepage.description=Check for and apply repo updates"

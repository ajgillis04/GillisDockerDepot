# Purpose: A Docker Compose file to create containers
# Clone:   git clone https://github.com/ajgillis04/GillisDockerDepot.git
# Prereqs: Ensure Docker and Docker Compose are installed
# Prereqs 2: You need to create a .env in your root folder with all $variables below
# Prereqs 3: requires a /secrets folder with all your sensitive data
# Help:    I relied heavily on https://www.smarthomebeginner.com/ at the beginning
# Notes:   Ensure permissions for Docker files and secrets
#          chmod 700 ~/path/to/secrets
#          chmod 600 ~/path/to/secrets/*
#          make sure PUID and PGID match the system you are in with .env
#          After the services are online, retrieve the API keys and update .env/secrets
# Usage: docker compose -p mediaserver -f docker-compose-server7.yaml up --detach
# **********************************************************************************

# *************************** NETWORKS ****************************************** 
# You may customize the network subnet (172.30.0.0/24) below as you please.
# Docker Compose version 3.5 or higher required to define networks this way. You no longer have to create them manually.
networks:
  mediaserver:
    name: mediaserver
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
 #   external: true # use if not managing network with docker-compose.yaml
  default:
    driver: bridge
 #   ipam:
 #     config:
 #       - subnet: 192.168.2.0/24  # Ensure this subnet does not overlap with your existing network
 #         gateway: 192.168.2.1
 #   external: true # use if not managing network with docker-compose.yaml
  pihole_network:
    # Pi-hole gets its own address on the LAN (192.168.4.12). The eero keeps DHCP.
    # Macvlan: the NAS itself can't reach .12 directly; Homepage reaches Pi-hole over mediaserver.
    name: pihole_network
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.4.0/22 # the eero's network
          gateway: 192.168.4.1
          ip_range: 192.168.4.12/32 # Docker hands out only .12
#  ha_bridge:    
#    driver: bridge
#    ipam:
#      config:
#        - subnet: 172.32.0.0/24


# ***********************************************************************************
# Created: Andy Gillis
# Date:    Apr 20, 2020
# Purpose: Docker Compose for server5, the cottage PC (Cottage-PC, 192.168.3.250)
# Clone:   git clone https://github.com/ajgillis04/GillisDockerDepot.git
# Prereqs: Ensure Docker and Docker Compose are installed
# Prereqs 2: You need to create a .env in your root folder with all $variables below
# Prereqs 3: requires a /secrets folder with all your sensitive data
# Help:    I relied heavily on https://www.smarthomebeginner.com/ at the beginning
# Notes:   Ensure permissions for Docker files and secrets
#          chmod 700 ~/path/to/secrets
#          chmod 600 ~/path/to/secrets/*
#          make sure PUID and PGID match the system you are in with .env
#          After the services are online, retrieve the API keys and update .env/secrets
# Usage: docker compose -p mediaserver -f docker-compose-server5.yaml up --detach
# **********************************************************************************

# *************************** NETWORKS ******************************************
networks:
  mediaserver:
    name: mediaserver
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  default:   # mediaserver_default: wireguard-server and cottage-ddns
    driver: bridge

# *************************** SECRETS ******************************************
# Only the secrets server5 services use. repo-updater reads secrets/nas_gmail_app_pass as a file.
secrets:
  guac_mysql_user:
    file: ${SECRETSDIR}/guac_mysql_user
  guac_mysql_password:
    file: ${SECRETSDIR}/guac_mysql_password
  maria_root_password:
    file: ${SECRETSDIR}/maria_root_password

# *************************** SERVICES ******************************************
# No web ports are opened to the internet: outside access is the Cloudflare tunnel
# (cottage-homepage/-guac/-portainer/-lorex/-deploy.gillisonline.com, routes set in
# Cloudflare) and the cottage VPN (UDP 51820 forwarded on the Giga Hub).
include:
  - ${COMPOSE_DIR}/cloudflared.yaml      # tunnel; routes are set in Cloudflare (token mode)
  - ${COMPOSE_DIR}/repo-updater.yaml     # monthly update email + upgrade page (cottage-deploy)
  - ${COMPOSE_DIR}/guacamole.yaml
  - ${COMPOSE_DIR}/guacd.yaml
  - ${COMPOSE_DIR}/homepage.yaml
  - ${COMPOSE_DIR}/mariadb.yaml          # Guacamole's database
  - ${COMPOSE_DIR}/pihole.yaml           # DNS only, not used by the hub (see the file)
  - ${COMPOSE_DIR}/portainer.yaml
  - ${COMPOSE_DIR}/watchtower.yaml
  - ${COMPOSE_DIR}/wireguard-server.yaml # the cottage's own VPN: cottage-vpn.gillisonline.com:51820
  - ${COMPOSE_DIR}/cottage-ddns.yaml     # keeps cottage-vpn.gillisonline.com on the cottage's IP
  - ${COMPOSE_DIR}/wireguard-client.yaml # cottage PC joins the home VPN as 10.9.0.11 (alerts, backups, way in)
